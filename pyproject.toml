[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buffer-gpt-action-api"
version = "1.4.0"
description = "Secure REST facade for GPT Actions, Buffer GraphQL, and Instagram carousels"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]
